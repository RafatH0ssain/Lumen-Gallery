<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lumen Gallery — an endless corridor through the Cleveland Museum of Art's open collection, with docent notes written by AI."
    />
    <title>Lumen Gallery</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230e0e0d'/%3E%3Crect x='20' y='22' width='16' height='56' fill='%23f3efe3'/%3E%3Crect x='20' y='62' width='38' height='16' fill='%23f3efe3'/%3E%3Crect x='64' y='22' width='16' height='16' fill='%23d8231f'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#0e0e0d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load async so text renders immediately in the fallback face;
         display=swap upgrades in place. Removes ~1.3s of render blocking.
         One family (Archivo) now carries body and display weights. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- crossorigin: the search fetch is a CORS request and can only reuse
         a preconnected socket opened in CORS mode. Images are no-cors, so
         the CDN preconnect stays credentialless. -->
    <link
      rel="preconnect"
      href="https://openaccess-api.clevelandart.org"
      crossorigin
    />
    <link rel="preconnect" href="https://openaccess-cdn.clevelandart.org" />
    <script>
      // LCP: the first artwork can't paint until the first explore request
      // returns, so fire it here — in flight while the app bundle is still
      // downloading. Consumed once by useFeed via resolveBootPage().
      // KEEP IN SYNC with CLASSIC_TYPES/pickType()/fetchExplorePage()/FIELDS
      // in src/lib/cma.js: same query, same fields, same weighted type draw.
      // Written in ES5 because it runs before any bundle — nothing here may
      // assume a transpiler has seen it.
      (function () {
        // CMA has no deep-pagination cap, so any page of any one fine-art type
        // is fair game. But the API takes exactly ONE `type` per request, and
        // the weights are hand-set rather than proportional to the totals, or
        // Print would hang the whole wall. Same table as CLASSIC_TYPES in
        // src/lib/cma.js.
        var CLASSIC_TYPES = [
          { type: "Painting", weight: 30, total: 3955 },
          { type: "Print", weight: 20, total: 10825 },
          { type: "Drawing", weight: 15, total: 1995 },
          { type: "Sculpture", weight: 15, total: 1979 },
          { type: "Photograph", weight: 10, total: 989 },
          { type: "Portrait Miniature", weight: 5, total: 164 },
          { type: "Tapestry", weight: 3, total: 58 },
        ];
        var sum = 0;
        var i;
        for (i = 0; i < CLASSIC_TYPES.length; i++) {
          sum += CLASSIC_TYPES[i].weight;
        }
        var r = Math.random() * sum;
        var entry = CLASSIC_TYPES[0];
        for (i = 0; i < CLASSIC_TYPES.length; i++) {
          r -= CLASSIC_TYPES[i].weight;
          if (r < 0) {
            entry = CLASSIC_TYPES[i];
            break;
          }
        }
        var page = Math.floor(Math.random() * Math.max(1, Math.floor(entry.total / 12)));
        // Once the page data arrives, preload the first artwork's image so the
        // LCP image is downloading while React is still booting. KEEP IN SYNC
        // with the <img> in src/components/ArtCard.jsx and imageUrl() in
        // src/lib/cma.js. CMA serves one fixed `web` rendition per work, so
        // unlike the AIC build there is no width to compute — the URL arrives
        // ready-made in the record.
        function preloadFirstImage(res) {
          res
            .clone()
            .json()
            .then(function (j) {
              var first = (j.data || []).filter(function (a) {
                return a && a.images && a.images.web && a.images.web.url;
              })[0];
              if (!first) return;
              var l = document.createElement("link");
              l.rel = "preload";
              l.as = "image";
              l.fetchPriority = "high";
              l.href = first.images.web.url;
              document.head.appendChild(l);
            })
            .catch(function () {});
          return res;
        }
        window.__lumenBoot = {
          // Keyed by type and page, matching fetchExplorePage(), so the page
          // this request already paid for is not drawn again a moment later.
          visitedPages: new Set([entry.type + ":" + page]),
          firstPage: fetch(
            "https://openaccess-api.clevelandart.org/api/artworks/" +
              "?has_image=1&cc0=1" +
              "&fields=id,title,creators,creation_date,technique,type,culture,images" +
              "&type=" +
              encodeURIComponent(entry.type) +
              "&skip=" +
              page * 12 +
              "&limit=12",
          ).then(preloadFirstImage),
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
