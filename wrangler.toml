name = "lumen-gallery"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# LUMEN_KV must live here as well as in the Pages dashboard binding.
# `wrangler pages deploy` writes this file's bindings into the deployment
# config, so a missing block silently unbinds the namespace in production
# and every function touching LUMEN_KV throws error 1101.
[[kv_namespaces]]
binding = "LUMEN_KV"
id = "e5f109255422499f914e947ab43acb3e"
